# --- SAFETY & COMFORT ---
safety:
  temp_min_c: 18.0
  temp_max_c: 28.0
  max_delta_c_per_step: 2.0

comfort:
  deadband_c: 2.0
  pmv_band: 0.5          
  outdoor_temp_ewma_alpha: 0.1
hysteresis:
  min_delta_c: 0.3
  min_dwell_steps: 3

seasonality:
  winter_limit: 14.0
  summer_limit: 22.0
  comfort_ranges:
    winter: [21.0, 21.8]
    summer: [23.5, 25.5]
  clothing:
    winter_clo: 1.1
    shoulder_clo: 0.7
    summer_clo: 0.4

# --- GATE SCORING ---
gate:
  ccs_threshold: 0.65
  weights:
    violation: 0.40
    rate_penalty: 0.15
    llm_confidence: 0.15
    override_rate: 0.10 
    carbon: 0.20   

  max_violation_severity: 0.0
  override_window: 20
  enforce_baseline_direction: true
  baseline_direction_tolerance_c: 0.1

# --- STRATEGIST ---
strategist:
  model: "openai/gpt-oss-20b"
  cadence_steps: 12
  correction_skip_delta_c: 0.15
  secondary_provider:
    enabled: true
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "SECONDARY_LLM_API_KEY"
    model: "gemini-3.6-flash"
    rpm: 15
    rpd: 0
  provider_pool:
    additional_providers:
      - name: cerebras
        enabled: false
        base_url: "https://api.cerebras.ai/v1"
        api_key_env: "CEREBRAS_API_KEY"
        model: "llama3.1-8b"
        rpm: 30
        rpd: 0
      - name: openrouter
        enabled: false
        base_url: "https://openrouter.ai/api/v1"
        api_key_env: "OPENROUTER_API_KEY"
        model: "meta-llama/llama-3.1-8b-instruct:free"
        rpm: 15
        rpd: 0
  max_requests_per_minute: 25
  rpd: 1000
  call_timeout_s: 10
  correction_timeout_s: 5
  forecast_lookahead_hours: 3
  decision_cache:
    enabled: true
    indoor_bin_c: 0.5   
    outdoor_bin_c: 1.0  
    hour_bin_h: 3.0     

    ttl_ticks: 4
  trigger:
    enabled: true
    deviation_deadband_c: 0.8
    outdoor_delta_threshold_c: 3.0
    max_staleness_steps: 96
    debounce_steps: 2
  timestep_minutes: 15

# --- FAILSAFE (The missing key that caused the error) ---
failsafe:
  target_low_c: 21.0
  target_high_c: 23.0
  setback_c: 1.0

# --- BACNET HARDWARE BRIDGE (2.1) ---
bacnet:
  enabled: false
  device_ip: "127.0.0.1:47830"
  point_instance: 1
  local_ip: "127.0.0.1"
  local_port: 47820
  priority: 8

# --- BASELINE ---
baseline:
  schedule_setpoint_c: 22.0

# --- MULTI-ZONE (1.1) ---
multizone:
  zone_names: ["ZONE ONE", "ZONE TWO"]

# --- CARBON SIGNAL ---
carbon:
  profile: "flat_medium"
  profiles:
    flat_medium: ["Low", "Medium", "High"]
  cycle_steps: 30
  score_map:
    Low: 1.0
    Medium: 0.6
    High: 0.2

# --- PATHS ---
paths:
  controlled_idf: "models/controlled.idf"
  two_zone_idf: "models/two_zone_controlled.idf"
  epw: "models/baseline.epw"
  control_log_ai: "logs/ai/control_log.jsonl"
  control_log_baseline: "logs/baseline/control_log.jsonl"
  control_log_multizone_dir: "logs/multizone"
